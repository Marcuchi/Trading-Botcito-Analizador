name: ML RSI Pro - Analisis horario

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Enviar mensaje de prueba a Telegram"
        required: false
        default: false
        type: boolean

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr analisis
        run: python run_once.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Mensaje de prueba a Telegram
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_telegram == 'true'
        run: python send_test.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persistir estado
        run: bash scripts/persist_state.sh
